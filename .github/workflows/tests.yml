name: Pruebas

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  corrector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pruebas del corrector de búsqueda
        run: node --test tests/*.test.js
