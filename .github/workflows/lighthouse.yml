name: Calidad (Lighthouse)

# Mide la app publicada como la vería un celular: rendimiento, accesibilidad, buenas prácticas y SEO.
# Falla si la accesibilidad baja de 90; el resto queda como aviso en el reporte.
on:
  schedule:
    - cron: '30 12 * * 1' # lunes 9:30 de Argentina, después de la revisión semanal
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Medir con Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://donde-la-veo-app.vercel.app/
            https://donde-la-veo-app.vercel.app/t/movie/603-matrix
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
