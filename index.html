<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¿Dónde la veo? se mudó</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://donde-la-veo-app.vercel.app/">
<meta name="theme-color" content="#000000">
<link rel="icon" href="icons/icon-192.png">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #000; color: #f5f5f7;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  a { color: #0a84ff; }
  img { width: 72px; height: 72px; border-radius: 16px; }
</style>
<script>
  // ¿Dónde la veo? ahora vive en Vercel. Esta página redirige y se lleva «Mis plataformas» y «Mi lista»,
  // que el navegador guarda por dirección y se perderían al cambiar de sitio.
  (function () {
    var DESTINO = 'https://donde-la-veo-app.vercel.app/';
    var ficha = /^#(movie|tv)-\d+$/.test(location.hash) ? location.hash.slice(1) : '';
    var datos = {};
    try {
      var mine = localStorage.getItem('mis_plataformas');
      var lista = localStorage.getItem('mi_lista');
      if (mine) datos.mine = JSON.parse(mine);
      if (lista) datos.lista = JSON.parse(lista);
    } catch (e) {}
    // La versión vieja quedaba guardada para usarse sin internet: se borra para que no vuelva a aparecer
    try {
      if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); });
      if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); });
    } catch (e) {}
    var destino = DESTINO + (ficha ? '#' + ficha : '');
    if (datos.mine || datos.lista) {
      try {
        var b = btoa(unescape(encodeURIComponent(JSON.stringify(datos)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        destino = DESTINO + '#importar=' + b + (ficha ? '&' + ficha : '');
      } catch (e) {}
    }
    location.replace(destino);
  })();
</script>
<noscript><meta http-equiv="refresh" content="0; url=https://donde-la-veo-app.vercel.app/"></noscript>
</head>
<body>
  <div>
    <img src="icons/icon-192.png" alt="">
    <h1>¿Dónde la veo? se mudó</h1>
    <p>Ahora está en <a href="https://donde-la-veo-app.vercel.app/">donde-la-veo-app.vercel.app</a>. Te llevamos en un segundo…</p>
  </div>
</body>
</html>
